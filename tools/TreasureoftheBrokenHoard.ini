[MODULE]
id: DDAL05-01
title: Treasure of the Broken Hoard
system: D&D 5E
level.range: 1-2
setting: Faerûn, Greypeak Mountains, Sword Coast (Forgotten Realms)
theme: Treasure hunting, Giant intrigue, Cult of the Dragon, Exploration
tone: Fast-paced, modular, accessible to new players, action-adventure
source: Adventurers League, Storm King's Thunder Season

[ADVENTURE]
summary: Following the defeat of the Cult of the Dragon, their hoarded treasures were hidden across the Greypeak Mountains in several secret caches. Treasure hunter Veradda Stoor uncovered the locations of five such caches, but was killed by rival seekers, including giants and their minions. The player characters, called to meet Veradda, must now race against deadly opposition to claim the hoard caches and survive the traps, puzzles, and monstrous guardians left behind.
hook: Each PC is sent (either by their faction or word of mouth) to rendezvous with famous treasure hunter Veradda Stoor at a clearing near Parnast, to help her recover hidden caches of Cult of the Dragon treasure.
win.condition: Locate and secure as many of the five hidden treasure caches as possible, surviving opposition and defeating or outmaneuvering rival seekers, especially giants and their followers.
fail.condition: The PCs are killed, desert the quest, or allow the caches to fall entirely to rival claimants; if the caches fall into the hands of malevolent giants or cult remnants, the Cult's return is facilitated.

[PLOT:MAIN]
act.1: The heroes arrive to find Veradda Stoor murdered. Searching her body and notes, they retrieve scrolls with clues to the five caches. The hunt begins.
act.2: The adventurers systematically pursue the caches, traveling through treacherous terrain. Each mini-adventure presents a unique set of hazards (goblins, traps, monsters, rival seekers, curses) and distinct mechanical and roleplaying challenges.
act.3: The opposition and guardians intensify—magic traps, cursed treasures, desperate kobolds, elemental monsters, puzzles, and territorial giants increase the risk and variety of each mission.
climax: The PCs confront their final adversaries and puzzles atop the highest peak, in the desecrated shrine of Annam, where a storm giant appears, and the consequences of their choices and respect for giant customs are judged.
resolution: The group survives, claims the treasures, earns reputation/boons (or curses), and learns dire omens regarding the coming war among the giants and the shift in power after the fall of Tiamat. Faction and story rewards, as well as magic and monetary treasures, are distributed.
branches: Choice of cache order (though intended sequentially), ways to interact with certain guardians (ally, bypass, combat), fail-forward solutions if traps or puzzles are failed, outcomes for handling legendary figures (e.g., storm giant Kraddokk).
dependencies: Progression on main plot requires clues from Veradda's scrolls; some puzzles/clues reward earlier interactions (friendship with galeb duhr, clues about cult activities).

[TIMELINE]
t01: PCs summoned to meet Veradda Stoor, find her dead, recover clues.
t02: PCs tackle caches in sequence: Beneath the Hills, Upon the Stones, Against the Frost, Through the Fires, Above the Clouds.
t03: Rival factions (giants, cult remnants, kobolds) make their presence felt at each cache.
t04: After all caches are resolved, consequences with Kraddokk the storm giant and story award distribution.
notes: Each cache is designed as a short mini-adventure, suitable for play in 1-2 hours; encounters and outcomes at each cache may affect ongoing reputation, clues, and risks in subsequent missions.

[TIMELINE_EVENT:T01]
name: The Death of Veradda Stoor
type: Plot
time.relative: Start
location: Clearing outside Parnast (LOC_001)
plot.ref: PLOT:MAIN
trigger: PCs arrive at the rendezvous point after being summoned.
summary: The party finds Veradda's bloody remains, her notes stolen, but spare scrolls containing clues to the hidden caches are found on her person.
consequences: Launches the treasure hunt; PCs become secondary targets to rival seekers; the antagonistic stakes are set.
flags.set: found_Veradda_dead, obtained_cache_clues
flags.required:

[TIMELINE_EVENT:T02]
name: Beneath the Hills
type: Encounter/Discovery
time.relative: After T01
location: Cave beneath foothills, Greypeak Mountains (LOC_002)
plot.ref: PLOT:MAIN
trigger: PCs follow first clue from Veradda's notes.
summary: PCs face goblin guards, cursed goblin swarm, cursed hill giant Slayermighty and his shrunken bear Blooddrinker; discover chest looted by cloud giants.
consequences: PCs may rescue/tame Blooddrinker; treasures: alchemist's fire, potion of healing, copper necklace; encounter evidence of cloud giant rivalry.
flags.set: cache1_looted, met_Slayermighty, rescued_Blooddrinker
flags.required: found_Veradda_dead

[TIMELINE_EVENT:T03]
name: Upon the Stones
type: Encounter/Puzzle/Discovery
time.relative: After T02
location: Boulder Pyramid, central Greypeaks (LOC_003)
plot.ref: PLOT:MAIN
trigger: PCs follow second clue from Veradda's notes.
summary: PCs cross rent field guarded by giant badgers, climb pyramid inhabited by galeb duhr family (possibly gain their aid), solve runic passphrase puzzle, find giant corpse and loot, discover kobold tunnel, recover damaged Cult ledger.
consequences: Possibility of earning "Friend of Prrrt" award; recover Cult ledger; encounter risk of further cult/giant conflict.
flags.set: cache2_found, befriended_GalebDuhr, solved_passphrase
flags.required: found_Veradda_dead

[TIMELINE_EVENT:T04]
name: Against the Frost
type: Encounter/Trap/Combat
time.relative: After T03
location: Secret chamber in green mountain, northern Greypeaks (LOC_004)
plot.ref: PLOT:MAIN
trigger: PCs follow third cache clue.
summary: PCs navigate false/real secret doors, avoid or trigger pit and glyph traps, discover murdered frost giants, contend with greed-maddened curse and greed motes, recover diamond dust and giant coins.
consequences: PC's may suffer "Stung by Greed" curse; treasures: diamond dust, coins, healing potions; further evidence of giant in-fighting.
flags.set: cache3_found, triggered_greed_curse
flags.required: found_Veradda_dead

[TIMELINE_EVENT:T05]
name: Through the Fires
type: Encounter/Combat/Puzzle
time.relative: After T04
location: Ruined dwarven outpost, fiery tunnels (LOC_005)
plot.ref: PLOT:MAIN
trigger: PCs follow fourth cache clue.
summary: PCs confront kobolds sent by fire giants, battle or disarm magmin, deactivate Immix's fire symbol via multi-step challenge, retrieve melted silver.
consequences: Potential alliances or enmities with kobolds; treasures: topaz, melted silver, scroll of disguise self.
flags.set: cache4_found, deactivated_Immix_symbol
flags.required: found_Veradda_dead

[TIMELINE_EVENT:T06]
name: Above the Clouds
type: Encounter/Puzzle/Roleplay/Climax
time.relative: After T05
location: Shrine to Annam, high Greypeak Summit (LOC_006)
plot.ref: PLOT:MAIN
trigger: PCs follow fifth cache clue.
summary: PCs solve bell riddle to enter ancient giant shrine, defeat guardian mephits, may loot cultist remains and shrine plates, and meet storm giant Kraddokk for final judgment.
consequences: Earn "Friend of Kraddokk" or "Hated by Giants" award based on shrine looting; treasures: gold plates (if stolen, but cursed), cultist loot, possible extra healing potions.
flags.set: cache5_found, met_Kraddokk
flags.required: found_Veradda_dead

