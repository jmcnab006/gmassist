[AREA:LOC_001]
name: Clearing near Parnast
desc.short: Veradda's rendezvous site
desc.long: A blood-spattered clearing outside the hamlet of Parnast, set beneath the Greypeak Mountains. Footprints and chaos reveal a recent ambush.
connects: Black Road, Parnast, foothills trail (to LOC_002)
light: Daylight (outdoor)
sound: Birds, wind, faint village noise
smell: Pine, blood
timeline.events: T01

[AREA:LOC_002]
name: Beneath the Hills Cave
desc.short: Rocky, trap-laden goblin cave
desc.long: A network of unstable tunnels beneath Greypeak's southernmost mountain. Rubble mounds, debris, and makeshift lanterns mark goblin activity and recent magical catastrophe.
connects: Entrance clearing, deeper tunnels (to south chamber), blocked east passage
light: Dim (lanterns)
sound: Echoing voices, scurrying, distant rumble
smell: Mold, damp earth, blood
timeline.events: T02

[AREA:LOC_003]
name: Boulder Pyramid Field
desc.short: Fused-boulder pyramid over a stone plain
desc.long: Vast, gouged field of fused volcanic stone, surmounted by a giant-constructed pyramid. The pyramid is runed and inhabited by curious galeb duhr.
connects: Flat stone field, pyramid interior
light: Day, sunlight (field), gloom within pyramid
sound: Whispering winds, grinding stone (galeb duhr)
smell: Hot earth, wildflowers, dead giant scent
timeline.events: T03

[AREA:LOC_004]
name: Frost Cursed Chamber
desc.short: Icy, trap-riddled mountain cavern
desc.long: Green-walled mountain path conceals hidden entrances to a chamber where frost giants met a cursed demise. Treacherous traps throughout, giant bodies inside.
connects: Cliffside trail, two secret doors, branching tunnels, central curse vault
light: None (bring torches)
sound: Whistling wind, echoing drops, faint ominous hum
smell: Cold stone, blood, faint ozone
timeline.events: T04

[AREA:LOC_005]
name: Ruined Dwarven Outpost
desc.short: Ancient dwarven forges, now fiery lair
desc.long: Blackened hallways and ancient forge rooms littered with kobold barricades. Central sentry building, magmin-haunted lava rivers, and Immix's flaring, magical symbol.
connects: Outpost entrance, sentry post, forge chamber
light: Dim to bright (lava/forge fire)
sound: Roaring fire, kobold chitter, sloshing lava
smell: Smoke, scorched stone, reptilian musk
timeline.events: T05

[AREA:LOC_006]
name: Shrine of Annam
desc.short: Cloud-touched ancient giant shrine
desc.long: Atop the Greypeak summit, beyond a wall of force and a riddle-etched bell, lies a vast giant-carved cave. Four copper braziers, a sacred slab to Annam, cultist corpses, and treasure await.
connects: Summit trail, bell platform, cave entrance
light: Daylight (outside), dim (cave, braziers when lit)
sound: Wind, echoing bell, distant thunder, mephit screeches
smell: Bracing air, old incense, faint rot
timeline.events: T06

