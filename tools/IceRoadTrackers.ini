[MODULE]
id: DDAL10-00
title: Ice Road Trackers
system: Dungeons & Dragons 5th Edition
level.range: 1-2
setting: Icewind Dale, Forgotten Realms
theme: Survival, Exploration, Rescue
tone: Dire, Heroic, Dark Fantasy
source: Wizards of the Coast, DDAL10-00

[ADVENTURE]
summary: A trek to Icewind Dale turns deadly when an avalanche blocks the heroes’ passage through the Spine of the World. Rescued by a member of a strange menagerie led by an awakened walrus called Mother Tusk, the heroes must aid her in exchange for continued safety and knowledge of the threats to the region.
hook: The heroes are traveling north seeking fortune or fleeing secrets, only to be saved from certain death by strange animals—they are then tasked with helping to protect the animals in exchange for survival and passage.
win.condition: Return Spritzel the otter to Mother Tusk and ensure at least one of Mother Tusk’s requested tasks is completed.
fail.condition: The party perishes (avalanche, freezing, or wolf attack), or Spritzel and the otter group are all killed.

[PLOT:MAIN]
act.1: The party is blocked by an avalanche in the Spine of the World and is saved by a muskrat, who leads them to safety and to Mother Tusk in an underground cavern.
act.2: Mother Tusk requests the party’s help in rescuing her missing otter child, Spritzel, presumed in danger while spying near Easthaven.
act.3: The party tracks down Spritzel, now pursued by wolves, and navigates perilous ice slides to rescue the otters from a deadly wolf pack led by an awakened wolf.
climax: The heroics peak as the party must defeat the wolves within an icy, water-filled cavern and then survive a bitter, freezing trek back to safety—making difficult choices regarding warmth and resources.
resolution: Upon successful return, Mother Tusk rewards the party and offers hope against the larger threats menacing Icewind Dale; if all adventures are completed, the party is sent forth into the deadly blizzards, changed and warned.
branches: None in this sample; additional branches in episodic editions.
dependencies: Must rescue Spritzel and survive; requires party consent to aid Mother Tusk.

[TIMELINE]
t01: Avalanche strikes, party saved by muskrat, meets Mother Tusk in cavern
t02: Party receives quest to rescue Spritzel the otter
t03: Tracks found, attempt to locate otters and wolves (success or failure changes cold/weather survival rolls)
t04: Ice slides action, encounter with wolves and rescue of otters, treasure found, escape and survival challenge
notes: Outcome of wolf encounter and freezing challenge affects level of exhaustion or success; rewards on return

