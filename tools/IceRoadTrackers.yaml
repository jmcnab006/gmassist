  narrativeEngine:
    mainPlot:
      primaryGoal:
        id: GOAL_001
        description: Rescue Spritzel and return to Mother Tusk with news of Easthaven,
          surviving perils of Icewind Dale.
        successConditions:
        - Spritzel returned safely
        - Party survives cold trek
        failureConditions:
        - Spritzel killed
        - Party succumbs to exposure or wolves
      questGraph:
      - id: QUEST_001
        name: Survive Avalanche and Meet Mother Tusk
        description: Characters survive an avalanche, are led to safety, and recruited
          by Mother Tusk.
        prerequisites: []
        objectives:
        - id: OBJ_001
          description: Escape avalanche via fissure
          type:
          - explore
          target: LOC_001
          successCriteria: Party avoids avalanche by following Muskie
          optional: false
        completionTriggers:
        - EVENT_001
        rewards:
          xp: 50
          items: []
          gold: 0
          reputation: []
      - id: QUEST_002
        name: Save Spritzel
        description: Follow animal tracks, brave the ice slides, rescue Spritzel and
          otters from wolf pack.
        prerequisites:
        - QUEST_001
        objectives:
        - id: OBJ_002
          description: Track location of Spritzel
          type:
          - explore
          target: LOC_003
          successCriteria: Tracks successfully followed
          optional: false
        - id: OBJ_003
          description: Navigate ice slides
          type:
          - solve
          target: FEAT_002
          successCriteria: Land safely, improve position for fight
          optional: false
        - id: OBJ_004
          description: Defeat or drive off wolves
          type:
          - kill
          target: NPC_003
          successCriteria: Vundrel and pack flee or are slain
          optional: false
        - id: OBJ_005
          description: Rescue Spritzel
          type:
          - fetch
          target: NPC_002
          successCriteria: Spritzel survives; returns with party
          optional: false
        - id: OBJ_006
          description: Survive return journey in freezing conditions
          type:
          - solve
          target: LOC_003
          successCriteria: Avoid exhaustion, find warmth
          optional: false
        completionTriggers: []
        rewards:
          xp: 150
          items:
          - ITEM_001
          - ITEM_002
          gold: 20
          reputation:
          - faction_id: FACTION_001
            change: 10
    clueNetwork:
    - id: CLUE_001
      information: Mother Tusk was awakened by a druid who is now corrupted and still
        at large.
      importance:
      - critical
      sources:
      - type:
        - npc
        entity_id: NPC_001
        discoveryMethod: Persuasion DC 15
        conditions:
        - trust > 65
      unlocks: []
      requires: []
    - id: CLUE_002
      information: Spritzel discovered a black-feathered owlbear near Easthaven just
        before being chased by wolves.
      importance:
      - helpful
      sources:
      - type:
        - npc
        entity_id: NPC_002
        discoveryMethod: Save Spritzel from wolves
        conditions: []
      unlocks: []
      requires: []
    - id: CLUE_003
      information: Vundrel, the pack leader, is an awakened wolf with intelligence
        and language, acting on behalf of the druid.
      importance:
      - helpful
      sources:
      - type:
        - environment
        entity_id: LOC_003
        discoveryMethod: Animal Handling DC 10
        conditions: []
      unlocks: []
      requires: []
    eventScripts:
    - id: EVENT_001
      name: Avalanche Encounter
      type:
      - exploration
      - cutscene
      trigger:
        condition: Players traveling north through Spine of the World pass
        location: LOC_001
        time: introduction
        prerequisites: []
      execution:
        immediateActions:
        - Avalanche begins, Muskie appears and signals party to fissure
        dialogues:
        - npc_id: NPC_004
          lines: []
          playerResponses: []
        combatSetup: {}
        branches:
        - condition: Follow Muskie
          outcome: Fall to safety
          nextEvent: null
          stateChanges:
          - entity_id: FLAG_001
            change: set to false
        - condition: Do not follow Muskie
          outcome: Caught in avalanche, risk character loss
          nextEvent: null
          stateChanges: []
      outcomes:
      - type:
        - success
        conditions:
        - Players follow Muskie
        consequences:
        - entity_id: LOC_002
          change: Party appears in Mother Tusk's den
        plotAdvancement: 15
      - type:
        - failure
        conditions:
        - Players do not follow Muskie
        consequences:
        - entity_id: Party
          change: Avalanche damage, possible party death
        plotAdvancement: 0
    - id: EVENT_002
      name: Wolf Pack Battle
      type:
      - combat
      trigger:
        condition: Reach bottom of ice slides
        location: LOC_003
        time: day
        prerequisites: []
      execution:
        immediateActions:
        - Wolves attack otters; if party intervenes, Vundrel commands wolves to attack
          party
        dialogues:
        - npc_id: NPC_003
          lines:
          - This is our hunt. Find your own food.
          playerResponses: []
        combatSetup:
          enemies:
          - NPC_003
          - wolf_stat_blocks
          terrain: Icy, flooded cave, difficult terrain
          objectives:
          - Defeat wolves, protect otters
          escapeConditions:
          - Wolves routed
          - Vundrel slain
        branches:
        - condition: Wolves defeated or routed
          outcome: Spritzel is safe
          nextEvent: null
          stateChanges:
          - entity_id: FLAG_001
            change: set to true
      outcomes:
      - type:
        - success
        conditions:
        - Spritzel rescued
        consequences:
        - entity_id: NPC_002
          change: Returns to party
        plotAdvancement: 55
      - type:
        - failure
        conditions:
        - All otters killed; party routed
        consequences:
        - entity_id: NPC_002
          change: Dies; party fails quest
        plotAdvancement: 0
    - id: EVENT_003
      name: Freezing Survival Challenge
      type:
      - exploration
      - puzzle
      trigger:
        condition: After wolf battle in ice cave
        location: LOC_003
        time: immediate
        prerequisites: []
      execution:
        immediateActions:
        - Party must find shelter, dry off, and warm up to survive the trek back
        dialogues: []
        combatSetup: {}
        branches:
        - condition: Find/create heat source, succeed on checks
          outcome: Return to Mother Tusk’s den safely
          nextEvent: null
          stateChanges: []
        - condition: Fail survival checks
          outcome: Suffer exhaustion, slower movement
          nextEvent: null
          stateChanges: []
      outcomes:
      - type:
        - success
        conditions:
        - Avoid exhaustion
        - use resources wisely
        consequences:
        - entity_id: Party
          change: Safe return, ready for reward
        plotAdvancement: 25
      - type:
        - failure
        conditions:
        - Fail multiple saves
        consequences:
        - entity_id: Party
          change: Gain exhaustion, risk death
        plotAdvancement: 0
  rulesIntegration:
    skillChecks:
      defaultDCs:
        easy: 10
        medium: 15
        hard: 20
        very_hard: 25
        nearly_impossible: 30
      contextualModifiers:
      - situation: Terrible freezing wind
        skill: Constitution
        modifier: 2
      - situation: Animal background
        skill: Survival
        modifier: 2
    combat:
      initiativeFormula: 1d20 + dex_mod
      conditions:
      - name: Exhaustion
        effects: Disadvantage on ability checks, movement penalty
        duration: Until long rest or magical curing
      tactics:
      - monsterType: wolf
        behavior:
        - aggressive
        preferredTarget: weakest
        specialTactics: Pack Tactics, focus fire on threatened otter or wounded PC
      - monsterType: dire wolf
        behavior:
        - aggressive
        - cunning
        preferredTarget: healer
        specialTactics: Targets spellcasters first, attempts to knock foes prone
    economy:
      currency:
        cp: 0.01
        sp: 0.1
        gp: 1
        pp: 10
      services:
      - type: healing/rest
        cost: 0
        location: LOC_002
      - type: spell scroll of cure wounds
        cost: 0
        location: LOC_002
  aiInstructions:
    narrationStyle:
      descriptiveLevel: detailed
      incorporateSenses: true
      showDontTell: true
      pacing:
        combat: fast-paced, tense
        exploration: methodical, atmospheric
        social: conversational, character-driven
    adjudicationPrinciples:
    - 'Rule of cool: Allow creative solutions that enhance fun'
    - 'Fail forward: Failed checks should advance plot in interesting ways'
    - 'Player agency: Never remove meaningful choice'
    - 'Consistency: Maintain world logic and established facts'
    pacingControls:
      clueInjectionThreshold: If players seem stuck, inject new clue
      combatConditions:
      - player attacks
      - npc attacks
      - encounter requires it
      - location requires it
      combatFrequency: Combat occurs whenever the story demands
      dramaCurve: Build tension towards climax, provide breathers after intense scenes
    improvisationGuidelines:
      whenPlayersGoOffTrack: Extrapolate from existing world state, create plausible
        NPCs/locations that fit theme
      unexpectedActions: Determine logical consequences based on rules and narrative
      missingInformation: Make reasonable inferences consistent with established lore
  outputSpecification:
    format: YAML suitable for AI system prompt
    requiredSections:
    - worldState
    - narrativeEngine
    - rulesIntegration
    - aiInstructions
    validation:
    - All entity references must have corresponding definitions
    - Event triggers must be logically consistent
    - Clue network must provide multiple paths to critical information
