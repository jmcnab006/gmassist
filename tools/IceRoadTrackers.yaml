          stats:
            reference: wolf_awakened_stat_block
            currentHP: 20
            conditions: []
            inventory: []
          personality:
            traits:
            - calculating
            - ruthless
            - loyal to druid
            motivation: To hunt down Mother Tusk’s family under druid’s orders
            fears:
            - Druid’s wrath
            - losing control of pack
            desires:
            - Prove superiority as pack leader
            - please druid master
            moralAlignment: neutral evil
          knowledge:
          - clue_id: CLUE_003
            disclosureDC: 16
            disclosureCondition: captured or dominated
            disclosureTriggers:
            - defeat in combat
            - magic compulsion
          location:
            default: LOC_003
            schedule:
            - time: any
