              activity: Scouting for news, hiding from predators
          factionRelationships:
          - faction_id: FACTION_001
            standing: 75
            attitude: friendly
          behaviorScripts:
            onCombatStart: Dodges, calls to friends for help
            onThreatened: Tries to escape, may throw a trinket as a distraction
            onBribe:
              threshold: 10
              action: Will accept minor trinkets in exchange for information
            onDeath: Mother Tusk is heartbroken and the animal network scatters
        - id: NPC_003
          name: Vundrel
