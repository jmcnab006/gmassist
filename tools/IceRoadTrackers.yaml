              activity: Hunting otters, tracking intruders
          factionRelationships:
          - faction_id: FACTION_002
            standing: 100
            attitude: friendly
          behaviorScripts:
            onCombatStart: Attacks aggressively, prioritizes Spritzel and weak targets
            onThreatened: Attempts to regroup; flees if outnumbered
            onBribe:
