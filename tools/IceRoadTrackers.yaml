AdventureSystem:
  metadata:
    templateVersion: '2.0'
    purpose: Structure for LLM to extract D&D module data into AI-executable format
    sourceRequirements:
    - PDF/text module
    - Maps/images (if available)
    - Stat blocks
    outputFormat: System prompt for AI Dungeon Master
    adventureSummary: Ice Road Trackers is an introductory D&D Adventurers League
      adventure set as a prologue to Rime of the Frostmaiden. The party, led into
      the perilous north and saved from a deadly avalanche by an awakened muskrat,
      are recruited by Mother Tusk, a sentient walrus, to aid her animal family. In
      the 'Unsure Footing' episode, the party races to rescue Spritzel, an otter scout,
      from wolves, then faces survival challenges in the deadly cold before returning
      to Mother Tusk for safety, answers, and magical rewards.
    plotOutline:
    - opening scenes: The party's trek into Icewind Dale is blocked by an avalanche,
        leading to their rescue by an awakened muskrat, Muskie, who introduces them
        to Mother Tusk and her animal family.
    - adventure hooks:
      - The characters seek treasure and adventure in Icewind Dale, traveling from
        the Sword Coast.
      - Each character harbors a secret, driving them into the frozen North.
    - adventure flow:
      - 'Prologue - Avalanche: Party is saved from an avalanche by Muskie, then meets
        Mother Tusk, who requests aid.'
      - 'Unsure Footing: Party tasked with rescuing Spritzel, an otter scout, from
        wolves near Easthaven.'
    - side quests: []
    - main quests or objectives:
      - Rescue Spritzel the otter from wolves.
      - Survive the cold journey back to Mother Tusk's cave.
    - conclusion: After a successful return, Mother Tusk thanks the party and blesses
        them to face greater threats ahead. Characters decide whether to continue
        with further episodes or conclude their journey.
    - rewards:
      - 20 gp per episode per character (max 80 gp per adventure)
      - 2 spell scrolls of cure wounds
      - Boots of False Tracks (magic item)
    - completion: Upon successful rescue, characters may advance a level after completing
        two episodes. Adventure concludes with Mother Tusk's blessing and reward distribution.
  worldState:
    entities:
      schema:
        npc:
        - id: NPC_001
          name: Mother Tusk
          type:
          - quest_giver
          - ally
          description: A ten-foot awakened walrus, leader and protector of a menagerie
            of awakened animals, originally awakened by a goliath druid and now seeking
            to keep her charges safe from druidic corruption and the dangers of Icewind
            Dale.
          stats:
            reference: walrus_modified_stat_block
            currentHP: 42
            conditions: []
            inventory: []
          personality:
            traits:
            - maternal
            - ruthless
            - wise
            - protective
            motivation: To protect her animal family from harm, especially from her
              former corrupt druid master.
            fears:
            - Losing her charges
            - being recaptured/corrupted by the druid
            desires:
            - Safety for her family
            - counter the Everlasting Rime
            moralAlignment: neutral good
          knowledge:
          - clue_id: CLUE_001
            disclosureDC: 15
            disclosureCondition: trust > 65
            disclosureTriggers:
            - persistent questions about druid
            - repeated trust-earning actions
          location:
            default: LOC_002
            schedule:
            - time: day
              location: LOC_002
              activity: Tending family, overseeing den
            - time: night
              location: LOC_002
              activity: Resting or discussing with scouts
          factionRelationships:
          - faction_id: FACTION_001
            standing: 90
            attitude: friendly
          behaviorScripts:
            onCombatStart: Attempt to defend young, calls for animal support, tries
              to avoid direct violence unless forced
            onThreatened: Negotiates first, fights if cornered
            onBribe:
              threshold: 0
              action: Does not accept bribes
            onDeath: The animals panic and scatter, possible loss of animal intelligence
              in the region
        - id: NPC_002
          name: Spritzel
          type:
          - ally
          description: An awakened otter scout, adventurous and flamboyant, with white
            fur, a brown patch over the right eye, and a pearl earring.
          stats:
            reference: otter_awakened_stat_block
            currentHP: 9
            conditions: []
            inventory:
            - ITEM_002
          personality:
            traits:
            - irrepressible
            - brave
            - eccentric
            - showy
            motivation: To brave danger and find shiny things
            fears:
            - Boredom
            - a meaningless death
            desires:
            - Die spectacularly for a good cause
            - collect jewelry and trinkets
            moralAlignment: chaotic good
          knowledge:
          - clue_id: CLUE_002
            disclosureDC: 10
            disclosureCondition: helped rescue
            disclosureTriggers:
            - rescue from wolves
          location:
            default: LOC_003
            schedule:
            - time: variable
