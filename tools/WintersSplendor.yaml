  narrativeEngine:
    mainPlot:
      primaryGoal:
        id: GOAL_001
        description: Stop Asmodeus’s minions from disrupting the Midwinter Gala and
          disarm the summoning sigil.
        successConditions:
        - FLAG_005 is true
        - FLAG_006 is true
        failureConditions:
        - SIGIL continues summoning devils
        - Harm to innocent civilians
      questGraph:
      - id: QUEST_001
        name: Breaking the Ice
        description: Investigate the imp attack during Aria Cavatina's performance.
        prerequisites: []
        objectives:
        - id: OBJ_001
          description: Assist in subduing the imp that attacks Aria.
          type:
          - kill
          - protect
          target: NPC_012
          successCriteria: Imp is defeated or driven off.
          optional: false
        - id: OBJ_002
          description: Find the crumpled page from the children's book near the imp.
          type:
          - explore
          target: ITEM_017
          successCriteria: Page recovered.
          optional: false
        completionTriggers:
        - FLAG_002 set true
        rewards:
          xp: 150
          items: []
          gold: 50
          reputation:
          - faction_id: FACTION_003
            change: 5
      - id: QUEST_002
        name: Where There's Smoke…
        description: Explore the Cassalanter Villa and question guests to uncover
          Asmodeus's puzzle.
        prerequisites:
