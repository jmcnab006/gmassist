      - situation: Figuring puzzle details by inspection
        skill: Investigation
        modifier: 0
      - situation: Persuading Elzerina to tell
        skill: Persuasion
        modifier: 0
    combat:
      initiativeFormula: 1d20 + dex_mod
      conditions:
      - name: Poisoned
        effects: Disadvantage on attack rolls and ability checks
        duration: Until cured or rest
      - name: Frightened
        effects: Disadvantage on ability checks and attack rolls when source is in
          sight
        duration: Until end of encounter or cured
      tactics:
      - monsterType: Imp
        behavior:
        - cunning
        - cowardly
        preferredTarget: Radiant or celestial beings
        specialTactics: Uses invisibility to ambush and escape
      - monsterType: Spined Devil
        behavior:
        - aggressive
        - cunning
        preferredTarget: Elzerina and characters
        specialTactics: Flyby attacks and use tail spines at range
