AdventureSystem:
  metadata:
    templateVersion: '2.0'
    purpose: Structure for LLM to extract D&D module data into AI-executable format
    sourceRequirements:
    - PDF/text module
    - Maps/images (if available)
    - Stat blocks
    outputFormat: System prompt for AI Dungeon Master
  worldState:
    entities:
      schema:
        npc:
        - id: NPC_001
          name: Mother Tusk
          type:
          - quest_giver
          - ally
          description: A massive, awakened walrus who is the matriarch and protector
            of a menagerie of animals hiding in the Spine of the World.
          stats:
            reference: inline_stats
            currentHP: 58
            conditions: []
            inventory: []
          personality:
            traits:
            - protective
            - caring
            - ruthless toward threats
            motivation: To keep her charges safe and avoid the corrupted druid
            fears:
            - Her family being taken or harmed by the druid or civilization
            desires:
            - Sanctuary and safety for awakened animals
            moralAlignment: neutral good
          knowledge:
          - clue_id: CLUE_001
            disclosureDC: 15
            disclosureCondition: trust > 60
            disclosureTriggers:
            - PCs persuade her to talk about her past
          - clue_id: CLUE_003
            disclosureDC: 10
            disclosureCondition: trust > 30
            disclosureTriggers:
            - PCs ask about the curse
          location:
            default: LOC_001
            schedule:
            - time: day
              location: LOC_001
              activity: Resting, caring for animals
          factionRelationships:
          - faction_id: FACTION_001
            standing: 100
            attitude: friendly
          behaviorScripts:
            onCombatStart: Avoids fighting, protects animals, attempts to negotiate
              or interpose herself if absolutely necessary.
            onThreatened: Tries to bargain for peace, offers information, will fight
              fiercely to protect her family if needed.
            onBribe:
              threshold: 50
              action: Refuses direct bribes, only values safety for her family.
            onDeath: Family of animals panic and disperse. Local animal alliance becomes
              hostile to PCs.
        - id: NPC_002
          name: Spritzel
          type:
          - ally
          description: An awakened otter with a brown patch above his right eye, wearing
            a pearl earring. Irrepressibly brave and obsessed with shiny objects.
          stats:
            reference: inline_stats
            currentHP: 11
            conditions: []
            inventory:
            - ITEM_002
          personality:
            traits:
            - brave
            - impulsive
            - spectacle-loving
            - cheerful
            motivation: To find shiny things and have grand adventures
            fears:
            - Dying pointlessly
            desires:
            - A spectacular, meaningful life and falls
            moralAlignment: chaotic good
          knowledge:
          - clue_id: CLUE_004
            disclosureDC: 10
            disclosureCondition: asks about wolves or Easthaven
            disclosureTriggers:
            - PCs ask about threats in the area
          location:
            default: LOC_002
            schedule:
            - time: night
              location: LOC_001
              activity: Regales animals and PCs with stories
          factionRelationships:
          - faction_id: FACTION_001
            standing: 80
            attitude: friendly
          behaviorScripts:
            onCombatStart: Rallies other otters; attempts to cause distractions; supports
              allies.
            onThreatened: Tries to escape or hide.
            onBribe:
              threshold: 10
              action: Easily distracted by jewelry or shiny objects.
            onDeath: Mother Tusk and animal alliance mourn—hostility to PCs increases.
        - id: NPC_003
          name: Vundrel
          type:
          - villain
          - henchman
          description: An awakened wolf, leader of her pack, sent by the corrupted
            druid to hunt Mother Tusk and her family.
          stats:
            reference: wolf_stat_block_awakened
            currentHP: 18
            conditions: []
            inventory: []
          personality:
            traits:
            - loyal
            - disciplined
            - hungry for approval
            motivation: Prove loyalty to her druid master, eliminate Mother Tusk
            fears:
            - Failing her master
            desires:
            - The approval of the druid
            moralAlignment: lawful neutral
          knowledge:
          - clue_id: CLUE_005
            disclosureDC: 12
            disclosureCondition: defeated in combat and questioned
            disclosureTriggers: []
          location:
            default: LOC_003
            schedule:
            - time: any
              location: LOC_003
              activity: Hunting
          factionRelationships:
          - faction_id: FACTION_002
            standing: 100
            attitude: loyal
          behaviorScripts:
            onCombatStart: Gives tactical orders to wolves, targets the weakest.
            onThreatened: Attempts tactical retreat if outnumbered.
            onBribe:
              threshold: 200
              action: Bribery rejected unless druid's goals change.
            onDeath: Her pack falls into disarray or flees the region.
        location:
        - id: LOC_001
          name: Mother Tusk's Cavern
          type:
          - dungeon
          - wilderness
          - building
          description: A cold, echoing ice cavern hidden beneath the Spine of the
            World, filled with a menagerie of wary awakened animals.
          mapData:
            coordinates:
              x: 1
              y: 5
              z: -20
            connections:
            - LOC_002
            - LOC_004
            dimensions:
              width: 80
              height: 40
              units: feet
            lighting: dim
            terrain: normal
          contents:
            npcs:
            - NPC_001
            items: []
            features:
            - id: FEAT_001
              name: Hidden Tunnel Entrance
              description: A snow-covered fissure, barely visible except when pointed
                out by an animal or revealed by an event.
              interactive: true
              interaction:
                type:
                - mechanism
                dc: 13
                skill: Perception
                onSuccess: PCs find and use the entrance, evading the avalanche.
                onFailure: PCs miss the entrance, risk avalanche encounter.
                requires: []
            secrets:
            - id: SEC_001
              description: Mother Tusk’s true reason for fleeing the druid.
              discoveryDC: 17
              discoveryMethod: Insight or Persuasion
              reveals:
              - CLUE_001
          atmosphere:
            sounds:
            - echoing animal calls
            - dripping water
            - raspy walrus speech
            smells:
            - damp fur
            - cold air
            mood: sheltering, wary
            dangerLevel: 2
        - id: LOC_002
          name: Ice Slides Cavern
          type:
          - dungeon
          - room
          description: A chamber at the end of a series of ice slides, flooded with
            a foot of icy water, containing panicked otters and attacking wolves.
          mapData:
            coordinates:
              x: 2
              y: 9
              z: -28
            connections:
            - LOC_001
            - LOC_005
            dimensions:
              width: 60
              height: 50
              units: feet
            lighting: dim
            terrain: difficult
          contents:
            npcs:
            - NPC_002
            - NPC_003
            items:
            - ITEM_001
            features:
            - id: FEAT_002
              name: Ice Slides
              description: Curving, slick slides of ice that deposit entrants into
                the cavern below.
              interactive: true
              interaction:
                type:
                - trap
                dc: 12
                skill: Acrobatics
                onSuccess: Land on feet; gain advantage on initiative.
                onFailure: Take 1d6 damage, start prone.
                requires: []
            - id: FEAT_003
              name: Frozen Explorer Corpse
              description: A human explorer’s body, preserved on an icy shelf, boots
                still intact.
              interactive: true
              interaction:
                type:
                - container
                dc: 10
                skill: Investigation
                onSuccess: Discover boots of false tracks.
                onFailure: Miss the boots.
                requires: []
            secrets: []
          atmosphere:
            sounds:
            - howling wolves
            - squeaking otters
            - dripping water
            smells:
            - wet fur
            - cold stone
            mood: tense, urgent
            dangerLevel: 7
        - id: LOC_003
          name: Redwaters Shore
          type:
          - wilderness
          description: A snowy, wind-battered lakeshore on the journey between the
            cavern and Easthaven; marked by tracks in the snow.
          mapData:
            coordinates:
              x: 5
              y: 15
              z: 0
            connections:
            - LOC_002
            dimensions:
              width: 200
              height: 50
              units: feet
            lighting: dim
            terrain: difficult
          contents:
            npcs: []
            items: []
            features:
            - id: FEAT_004
              name: Animal Tracks
              description: Intermixed otter and wolf tracks lead away from the cavern.
              interactive: true
              interaction:
                type:
                - puzzle
                dc: 10
                skill: Survival
                onSuccess: Discern the direction and identities of the tracks.
                onFailure: Lose track, face harder freezing challenge.
                requires: []
            secrets: []
          atmosphere:
            sounds:
            - whistling wind
            - crunching ice
            smells:
            - biting cold air
            - fresh snow
            mood: isolated, perilous
            dangerLevel: 5
        - id: LOC_004
          name: Avalanche Site
          type:
          - wilderness
          description: The dangerous mountain pass within the Spine of the World,
            currently impassible due to a massive avalanche.
          mapData:
            coordinates:
              x: 1
              y: 0
              z: 10
            connections:
            - LOC_001
            dimensions:
              width: 500
              height: 100
              units: feet
            lighting: dim
            terrain: difficult
          contents:
            npcs: []
            items: []
            features:
            - id: FEAT_005
              name: Avalanche
              description: A recent, deadly avalanche barring all surface travel.
              interactive: false
              interaction: {}
            secrets: []
          atmosphere:
            sounds:
            - distant rumbling
            - shifting snow
            smells:
            - ozone
            - crushed ice
            mood: ominous, final
            dangerLevel: 8
        item:
        - id: ITEM_001
          name: Boots of False Tracks
          type:
          - wondrous
          - magic item
          - quest
          description: Fur-lined boots embroidered with gaudy but worthless gems,
            allow the wearer to leave tracks like those of another humanoid.
          properties:
            magical: true
            consumable: false
            weight: 2
            value: 50
            attunement: false
          location: LOC_002
          requires: []
          effects:
            onUse: May leave any humanoid tracks of your size.
            charges: 0
        - id: ITEM_002
          name: Spritzel's Pearl Earring
          type:
          - treasure
          description: A single large pearl, worn by Spritzel as an earring.
          properties:
            magical: false
            consumable: false
            weight: 0
            value: 15
            attunement: false
          location: NPC_002
          requires: []
          effects:
            onUse: Can be gifted or traded for favor.
            charges: 0
        faction:
        - id: FACTION_001
          name: Awakened Animal Family
          goal: To survive and avoid being used as pawns in the druid's plans.
          members:
          - NPC_001
          - NPC_002
          territory:
          - LOC_001
          - LOC_002
          resources:
          - diverse animal skills
          - local knowledge
          relationships:
          - faction_id: FACTION_002
            standing: -80
            status: hostile
        - id: FACTION_002
          name: Corrupted Druid & Followers
          goal: Control awakened animals, cause chaos for Ten-Towns.
          members:
          - NPC_003
          territory: []
          resources:
          - magic
          - pack animals
          relationships:
          - faction_id: FACTION_001
            standing: -80
            status: hostile
    globalVariables:
      plotFlags:
      - id: FLAG_001
        name: spritzel_rescued
        value: false
        triggers:
        - EVENT_003
      - id: FLAG_002
        name: otters_safe
        value: false
        triggers:
        - EVENT_003
      - id: FLAG_003
        name: party_frozen
        value: false
        triggers:
        - EVENT_004
      counters:
      - id: COUNTER_001
        name: exhaustion_levels
        current: 0
        max: 8
        min: 0
        onMax: Character collapses and risks death from cold.
        onMin: No exhaustion.
      time:
        current: 01 Uktar 1492 DR, midday
        advancementRate: per-encounter
        scheduledEvents:
        - event_id: EVENT_001
          triggerTime: whenever party leaves LOC_001
          conditions: []
          recurring: false
  narrativeEngine:
    mainPlot:
      primaryGoal:
        id: GOAL_001
        description: Aid Mother Tusk by rescuing her child Spritzel from wolves, and
          survive the dangerous ice caverns and cold.
        successConditions:
        - Spritzel is rescued and returned to Mother Tusk.
        failureConditions:
        - Spritzel dies or is lost; party succumbs to the cold.
      questGraph:
      - id: QUEST_001
        name: 'Prologue: Avalanche'
        description: Survive an avalanche in the Spine of the World and meet the animal
          matriarch, Mother Tusk.
        prerequisites: []
        objectives:
        - id: OBJ_001
          description: Escape the avalanche via aid from Muskie.
          type:
          - explore
          target: LOC_001
          successCriteria: Surviving avalanche and reaching the cavern.
          optional: false
        completionTriggers:
        - EVENT_001
        rewards:
          xp: 0
          items: []
          gold: 0
          reputation: []
      - id: QUEST_002
        name: 'Episode 1: Unsure Footing'
        description: Track and rescue Spritzel and his otter friends from a wolf pack
          within the ice slides of Redwaters.
        prerequisites:
        - QUEST_001
        objectives:
        - id: OBJ_002
          description: Track the animal footprints and find Spritzel's location.
          type:
          - solve
          target: LOC_003
          successCriteria: Identify tracks correctly and follow them to the ice slides.
          optional: false
        - id: OBJ_003
          description: Survive the ice slides into the cavern.
          type:
          - explore
          target: LOC_002
          successCriteria: Reach cavern, land safely, gain tactical advantage.
          optional: false
        - id: OBJ_004
          description: Defeat Vundrel and her wolves, save the otters.
          type:
          - kill
          target: NPC_003
          successCriteria: Wolves defeated, otters saved.
          optional: false
        - id: OBJ_005
          description: Find a way to resist freezing en route back.
          type:
          - solve
          target: LOC_003
          successCriteria: Mitigate exhaustion, reach shelter safely.
          optional: false
        completionTriggers:
        - EVENT_003
        rewards:
          xp: 300
          items:
          - ITEM_001
          gold: 20
          reputation:
          - faction_id: FACTION_001
            change: 20
    clueNetwork:
    - id: CLUE_001
      information: Mother Tusk fled from a druid who was corrupted and now seeks to
        use awakened animals in a bloodthirsty army.
      importance:
      - critical
      sources:
      - type:
        - npc
        entity_id: NPC_001
        discoveryMethod: Persuasion DC 15
        conditions:
        - trust > 60
      unlocks: []
      requires: []
    - id: CLUE_002
      information: A terrible curse lies over Icewind Dale—the sun never rises, making
        survival perilous.
      importance:
      - flavor
      sources:
      - type:
        - npc
        entity_id: NPC_001
        discoveryMethod: Conversation
        conditions: []
      unlocks: []
      requires: []
    - id: CLUE_003
      information: The otter Spritzel has been spying on Ten-Towns, specifically Easthaven,
        for Mother Tusk.
      importance:
      - helpful
      sources:
      - type:
        - npc
        entity_id: NPC_001
        discoveryMethod: Ask about Spritzel
        conditions: []
      unlocks: []
      requires: []
    - id: CLUE_004
      information: The wolves hunting Spritzel are led by Vundrel, an awakened wolf
        sent by the corrupted druid.
      importance:
      - helpful
      sources:
      - type:
        - npc
        entity_id: NPC_002
        discoveryMethod: Ask about the wolf leader
        conditions: []
      unlocks: []
      requires: []
    - id: CLUE_005
      information: Vundrel’s actions are dictated by her loyalty to a druid master,
        who is after Mother Tusk’s family.
      importance:
      - critical
      sources:
      - type:
        - npc
        entity_id: NPC_003
        discoveryMethod: Interrogate after defeat, Intimidation or Persuasion DC 12
        conditions: []
      unlocks: []
      requires: []
    eventScripts:
    - id: EVENT_001
      name: Avalanche Rescue
      type:
      - cutscene
      - exploration
      trigger:
        condition: PCs traveling in the pass (LOC_004)
        location: LOC_004
        time: any
        prerequisites: []
      execution:
        immediateActions:
        - Muskie the muskrat signals for PCs.
        - Avalanche strikes.
        dialogues:
        - npc_id: NPC_001
          lines:
          - Muskie found you in time. Good fortune!
          - Excuse my children. They’re suspicious by nature. Their lives often depend
            on it. My children call me Mother Tusk, and you may as well. I saved your
            lives for a reason.
          playerResponses:
          - option: Ask about rescue
            leadsTo: EVENT_002
        combatSetup: {}
        branches:
        - condition: PCs reject aid
          outcome: Buried in avalanche (likely death)
          nextEvent: null
          stateChanges: []
      outcomes:
      - type:
        - success
        conditions: []
        consequences:
        - entity_id: LOC_001
          change: PCs arrive safely
        plotAdvancement: 20
    - id: EVENT_002
      name: Mother Tusk's Offer
      type:
      - social
      trigger:
        condition: After rescue by muskrat
        location: LOC_001
        time: after EVENT_001
        prerequisites: []
      execution:
        immediateActions:
        - Mother Tusk requests help finding Spritzel.
        dialogues:
        - npc_id: NPC_001
          lines:
          - I sent one of my children, a young otter called Spritzel, on a scouting
            mission to watch the happenings in one of the Ten-Towns. He isn’t back
            yet. He often gets into trouble, and I need you to go look for him.
          - We’ve spotted wolves in the area, that could be dangerous for Spritzel.
          playerResponses:
          - option: Agree to help
            leadsTo: EVENT_003
        combatSetup: {}
        branches:
        - condition: PCs refuse
          outcome: Blocked from passage, no progress
          nextEvent: null
          stateChanges: []
      outcomes:
      - type:
        - success
        conditions:
        - PCs accept quest
        consequences:
        - entity_id: FLAG_001
          change: set to false (until rescue complete)
        plotAdvancement: 20
    - id: EVENT_003
      name: Otter/Wolf Cavern Encounter
      type:
      - exploration
      - combat
      trigger:
        condition: PCs track Spritzel to LOC_002
        location: LOC_002
        time: after EVENT_002
        prerequisites: []
      execution:
        immediateActions:
        - Skill checks for tracking and sliding.
        - Combat with wolves led by Vundrel.
        dialogues:
        - npc_id: NPC_003
          lines:
          - This is our hunt. Find your own food!
          playerResponses:
          - option: Negotiate
            leadsTo: EVENT_003A
          - option: Fight
            leadsTo: EVENT_003B
        - npc_id: NPC_002
          lines:
          - Thank you! We were returning from the town, saw a vicious owlbear, ran,
            then wolves chased us—wow, you look cold!
          playerResponses:
          - option: Ask about threats
            leadsTo: null
        combatSetup:
          enemies:
          - NPC_003
          - wolf_minions
          terrain: Flooded icy cavern
          objectives:
          - Rescue otters
          - Defeat wolves
          escapeConditions: []
        branches:
        - condition: PCs win combat
          outcome: Otters rescued
          nextEvent: EVENT_004
          stateChanges:
          - entity_id: FLAG_001
            change: set to true
          - entity_id: FLAG_002
            change: set to true
        - condition: PCs lose combat
          outcome: PCs forced to flee, otters in danger
          nextEvent: null
          stateChanges: []
      outcomes:
      - type:
        - success
        conditions:
        - Wolves defeated, Spritzel rescued
        consequences:
        - entity_id: NPC_002
          change: returns to Mother Tusk
        plotAdvancement: 40
    - id: EVENT_004
      name: Surviving the Cold
      type:
      - exploration
      trigger:
        condition: Combat with wolves ends
        location: LOC_002
        time: immediate
        prerequisites: []
      execution:
        immediateActions:
        - PCs are drenched and must find a way to prevent freezing.
        - Skill checks to generate heat or resist exhaustion.
        dialogues: []
        combatSetup: {}
        branches:
        - condition: PCs succeed DC 10 Con saves (6 times)
          outcome: Make it back to safety without harmful exhaustion
          nextEvent: null
          stateChanges: []
        - condition: PCs fail
          outcome: Accrue exhaustion, possible collapse
          nextEvent: null
          stateChanges:
          - entity_id: COUNTER_001
            change: increment
      outcomes:
      - type:
        - success
        conditions:
        - PCs warm themselves sufficiently
        consequences:
        - entity_id: FLAG_003
          change: set to false
        plotAdvancement: 10
      - type:
        - failure
        conditions:
        - Multiple exhaustion incurred
        consequences:
        - entity_id: FLAG_003
          change: set to true
        plotAdvancement: 2
    - id: EVENT_005
      name: Episode Conclusion
      type:
      - cutscene
      trigger:
        condition: Upon satisfying Mother Tusk's task or choosing to leave
        location: LOC_001
        time: after EVENT_004
        prerequisites: []
      execution:
        immediateActions:
        - Mother Tusk bestows her blessing and offers shelter.
        dialogues:
        - npc_id: NPC_001
          lines:
          - Be firm in your resolve, two-legger. Greater powers than you or me war
            here. May we meet again under better and brighter skies.
          playerResponses:
          - option: Ask about the future
            leadsTo: null
        combatSetup: {}
        branches: []
      outcomes:
      - type:
        - success
        conditions: []
        consequences:
        - entity_id: LOC_001
          change: PCs may rest, receive rewards
        plotAdvancement: 100
  rulesIntegration:
    skillChecks:
      defaultDCs:
        easy: 10
        medium: 15
        hard: 20
        very_hard: 25
        nearly_impossible: 30
      contextualModifiers:
      - situation: Blizzard conditions
        skill: Survival
        modifier: 2
      - situation: Tracking in deep snow
        skill: Nature
        modifier: 2
      - situation: Intelligent animal tactics
        skill: Animal Handling
        modifier: 1
    combat:
      initiativeFormula: 1d20 + dex_mod
      conditions:
      - name: prone
        effects: Melee attacks against have advantage, ranged attacks have disadvantage;
          spend half movement to stand.
        duration: until end of next turn or stands up
      - name: exhaustion
        effects: Disadvantage on ability checks (level 1), movement halved (level
          2), further penalties per PHB.
        duration: until long rest or magical healing
      tactics:
      - monsterType: wolf
        behavior:
        - aggressive
        - cunning
        preferredTarget: weakest
        specialTactics: Pack Tactics, coordinated attacks
      - monsterType: dire wolf
        behavior:
        - aggressive
        - cunning
        preferredTarget: healer
        specialTactics: Knock PCs prone with bite
    economy:
      currency:
        cp: 0.01
        sp: 0.1
        gp: 1
        pp: 10
      services:
      - type: long rest and sanctuary
        cost: 0
        location: LOC_001
  aiInstructions:
    narrationStyle:
      descriptiveLevel: detailed
      incorporateSenses: true
      showDontTell: true
      pacing:
        combat: fast-paced, tense
        exploration: methodical, atmospheric
        social: conversational, character-driven
    adjudicationPrinciples:
    - 'Rule of cool: Allow creative solutions that enhance fun'
    - 'Fail forward: Failed checks should advance plot in interesting ways'
    - 'Player agency: Never remove meaningful choice'
    - 'Consistency: Maintain world logic and established facts'
    pacingControls:
      clueInjectionThreshold: If players seem stuck, inject new clue
      combatConditions:
      - player attacks
      - npc attacks
      - encounter requires it
      - location requires it
      combatFrequency: Combat occurs whenever the story demands
      dramaCurve: Build tension towards climax, provide breathers after intense scenes
    improvisationGuidelines:
      whenPlayersGoOffTrack: Extrapolate from existing world state, create plausible
        NPCs/locations that fit theme
      unexpectedActions: Determine logical consequences based on rules and narrative
      missingInformation: Make reasonable inferences consistent with established lore
  outputSpecification:
    format: YAML suitable
    requiredSections:
    - worldState
    - narrativeEngine
    - rulesIntegration
    - aiInstructions
    validation:
    - All entity references must have corresponding definitions
    - Event triggers must be logically consistent
    - Clue network must provide multiple paths to critical information
