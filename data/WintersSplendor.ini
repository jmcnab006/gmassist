source: DDAL00-05C Winter's Splendor

[ADVENTURE]
summary: The PCs attend the Midwinter Gala at Cassalanter Villa in Waterdeep, only for a fiendish attack to shatter the festivities. Trapped inside by the City Watch, the party must solve a devilish puzzle involving children’s toys to dispel a supernatural threat orchestrated by Asmodeus, using clues from a fable and overcoming both social and magical obstacles. Bonus objectives involve completing a magical song and breaking a toy’s curse.
hook: Invited to the Midwinter Gala in Waterdeep’s Sea Ward, the party witnesses a celebrated opera singer attacked by a fiend as festivities begin.
win.condition: Solve the sigil puzzle, defeat Asmodeus’s minion, deactivate the portal, and restore peace to the Gala.
fail.condition: The portal remains open, devils continue to emerge; City Watch scorn; possible continued threat to the Cassalanter children.

[PLOT:MAIN]
act.1: The party experiences the Midwinter market, witnesses Aria Cavatina attacked by an imp, and is asked by City Watch Captain Staget to investigate.
act.2: The Cassalanter Villa is locked down, guests are questioned, clues from a fable and toy sigil reveal Asmodeus’s plot. PCs must assemble toys to recreate a summoning sigil, learning it must be completed at a specific altar in the City of the Dead.
act.3: PCs travel to the City of the Dead at night, locate the unmarked altar, and complete the toy sigil, summoning a spined devil minion.
climax: Battle with the spined devil (Koluchki); signature puzzle solution closes the portal.
resolution: Success sees the fiendish influence ended and the gala restored, with rewards for the players; failure means ongoing disturbances and City Watch scrutiny.
branches: Progress may branch based on social interactions (intimidation of children yields Watch scorn), and on which bonus objectives are completed.
dependencies: Access to the children’s room (and thus the toys and Chernok) or deciphering clues from The Wooden Girl fable and sigil; bonus objectives depend on exploring song fragments and the cursed toy.

[TIMELINE]
t01: Arrival at Midwinter Market; exploration and foreshadowing.
t02: Gala performance and imp attack; lockdown at Cassalanter Villa.
t03: Investigation phase; guest questioning; discovery of sigil, fable, and toy puzzle.
t04: Search for altar and showdown in City of the Dead; resolving sigil and battling the devil.
notes: Bonus objectives can be triggered during or after t03; players may revisit locations depending on investigation success.

